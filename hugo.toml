baseURL = "https://alchemicalmusings.org/"
languageCode = "en-us"
title = "Alchemical Musings"
theme = "mainroad"
# mainroad: MienDev fork, commit f7a975a (see themes/README.md)

paginate = 20

[Author]
  name = "Jonah Bossewitch"
  bio = "Aurum nostrum non est aurum vulgi"
  avatar = ""

[Params]
  description = "Aurum nostrum non est aurum vulgi"
  opengraph = true
  twitter_cards = false
  readmore = true
  authorbox = false
  pager = true
  post_meta = ["date", "categories"]
  mainSections = ["posts"]
  googleFontsLink = "https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"
  customCSS = ["/css/custom.css"]

[Params.logo]
  image = "images/jonahs_staff.png"
  title = "Alchemical Musings"
  subtitle = "Aurum nostrum non est aurum vulgi"

[Params.sidebar]
  home = "right"
  list = "right"
  single = "right"
  widgets = ["search", "recent", "categories"]

[Params.widgets]
  recent_num = 5
  tags_counter = false
  categories_counter = true

# JSON output for lunr search index
[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

